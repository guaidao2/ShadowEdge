<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowEdge</title>
<style>
:root{
  --bg:#0b0f14;--panel:#111827;--panel-2:#0f172a;--border:#1f2937;--border-2:#334155;
  --text:#e5e7eb;--muted:#94a3b8;--dim:#64748b;--accent:#22d3ee;--accent-2:#f97316;
  --danger:#ef4444;--ok:#22c55e;--warn:#f59e0b;--radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--border);background:rgba(15,23,42,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.brand{font-weight:700;letter-spacing:2px;color:var(--accent);font-size:15px;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--text);letter-spacing:1px;text-transform:none;font-weight:500;margin-left:8px;font-size:12px}
.spacer{flex:1}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav a,.nav button.btn-link{color:var(--muted);font-size:12px;padding:6px 8px;border-radius:6px;border:0;background:transparent}
.nav a:hover,.nav button.btn-link:hover{background:var(--panel);color:var(--text)}
.container{max-width:1500px;margin:0 auto;padding:22px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:18px;font-weight:600;letter-spacing:1px;margin:0}
.page-sub{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card.click{cursor:pointer;transition:border-color .15s,transform .15s}
.card.click:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:12px;min-height:32px}
.meta{color:var(--dim);font-size:11px}
.stats{display:flex;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.stats b{color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:7px;font-size:12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07131a;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:#7f1d1d;color:#fecaca;background:#1f1111}
.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);border-radius:7px;padding:9px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:78px}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.field{margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,#11202b 0%,var(--bg) 60%)}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-card h1{margin:0 0 4px;color:var(--accent);letter-spacing:2px;font-size:22px}
.auth-sub{color:var(--muted);font-size:12px;margin-bottom:22px}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px}
.auth-tabs button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:7px}
.auth-tabs button.active{border-color:var(--accent);color:var(--accent);background:rgba(34,211,238,.08)}
.msg{font-size:12px;margin-top:12px;padding:9px 10px;border-radius:7px;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(34,197,94,.1);color:#86efac;border:1px solid #14532d}
.msg.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid #7f1d1d}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;font-size:12px;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.board-col{min-width:230px;max-width:260px;flex:0 0 240px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px}
.board-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-bottom:9px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.count{margin-left:auto;color:var(--dim);font-size:11px}
.entity-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}
.entity-card:hover{border-color:var(--accent)}
.entity-card .t{font-size:12px;font-weight:600;margin-bottom:5px;word-break:break-word}
.kv{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.kv-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:0}
.kv-label{background:var(--panel-2);padding:7px 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.kv-value{padding:7px 10px;font-size:12px;word-break:break-word}
.kv-value pre{margin:2px 0;padding:6px}
@media(max-width:600px){.kv-row{grid-template-columns:1fr}.kv-label{border-bottom:1px solid var(--border)}}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:9px;text-transform:uppercase;letter-spacing:.6px;padding:2px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--border-2);color:var(--muted)}
.badge.k-target{color:#93c5fd;border-color:#1e40af}
.badge.k-service{color:#c4b5fd;border-color:#5b21b6}
.badge.k-finding{color:#fca5a5;border-color:#991b1b}
.badge.k-credential{color:#fcd34d;border-color:#92400e}
.badge.k-evidence{color:#6ee7b7;border-color:#065f46}
.badge.k-command{color:#67e8f9;border-color:#155e75}
.badge.k-task{color:#cbd5e1;border-color:#475569}
.badge.k-note{color:#86efac;border-color:#166534}
.badge.k-action{color:#fdba74;border-color:#9a3412}
.badge.s-new{color:#93c5fd}.badge.s-confirmed{color:#67e8f9}.badge.s-exploited{color:#fca5a5}.badge.s-fixed{color:#86efac}.badge.s-false_positive{color:#94a3b8}
.empty{color:var(--dim);font-size:12px;padding:18px;text-align:center}
.graph{height:620px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;background:var(--panel-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(34,211,238,.03)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{max-width:180px}
.modal-root{position:relative;z-index:50}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,12,.75);display:flex;align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto}
.modal{width:100%;max-width:720px;max-height:calc(100vh - 76px);overflow:auto;background:var(--panel);border:1px solid var(--border-2);border-radius:12px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
.modal .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--panel);padding-top:10px;padding-bottom:4px;z-index:2}
.board-col.highlight{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.form-section{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;grid-column:1/-1}
.form-section:first-child{border-top:0;padding-top:0}
.form-section h4{margin:0 0 8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
pre{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;font-size:11px;color:#cbd5e1;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:var(--panel);border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:100;transition:opacity .2s}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.mt{margin-top:14px}
.nowrap{white-space:nowrap}
.list-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.list-row:last-child{border-bottom:0}
.wrap{display:flex;gap:16px;align-items:flex-start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.row,.row3,.split{grid-template-columns:1fr}.board-col{flex:0 0 85vw}}
</style>
</head>

const DATA_LABELS = {
  ip:'ip', hostname:'hostname', os:'os', tags:'tags', target_id:'target', service_id:'service', importance:'importance',
  port:'port', protocol:'protocol', name:'service', product:'product', version:'version',

  data_type:'data_type', volume:'volume', channel:'channel', destination:'destination', objective:'objective',
  achieved:'achieved', summary:'summary', recommendations:'recommendations'
};

function dataEntries(kind, data){
  const obj = data || {};
  const order = (KIND_FIELDS[kind] || []).map(([key]) => key);
  const keys = Object.keys(obj).filter(key => key !== 'finding_key' && key !== 'phase_history');
  const ordered = order.filter(key => keys.includes(key))
    .concat(keys.filter(key => !order.includes(key)));
  return ordered.map(key => ({
    key,
    label: DATA_LABELS[key] ? t(DATA_LABELS[key]) : key,
    value: obj[key]
  }));
}

function dataValue(key, value){
  if (value === null || value === undefined || value === '') return '<span class="dim">—</span>';
  if (key === 'target_id'){
    const target = state.entities.find(e => e.id === value);
    return esc(target ? target.title : value);
  }
  if (key === 'service_id'){
    const service = state.entities.find(e => e.id === value);
    return esc(service ? service.title : value);
  }
  if (key === 'severity') return esc(severityLabel(value));
  if (key === 'command' || key === 'output') return `<pre>${esc(value)}</pre>`;
  if (typeof value === 'object') {
    if (Array.isArray(value)) return esc(value.join(', '));
    return esc(Object.entries(value).map(([k, v]) => `${k}: ${v}`).join(' · '));
  }
  return esc(String(value));
}

function renderDataFields(kind, data){
  const entries = dataEntries(kind, data);
  if (!entries.length) return `<div class="empty">${esc(t('no_data'))}</div>`;
  return `<div class="kv">${entries.map(({key,label,value}) =>
    `<div class="kv-row"><div class="kv-label">${esc(label)}</div><div class="kv-value">${dataValue(key,value)}</div></div>`
  ).join('')}</div>`;
}

function dataSummary(kind, data){
  const d = data || {};
  let out = '';
  switch (kind){
    case 'target': out = [d.ip, d.os].filter(Boolean).join(' · '); break;
    case 'service': out = [d.port ? `${d.port}/${d.protocol || 'tcp'}` : '', d.name || d.product].filter(Boolean).join(' · '); break;
    case 'finding': out = [d.severity, d.vuln_type || d.cve].filter(Boolean).join(' · '); break;
    case 'credential': out = [d.protocol, d.username].filter(Boolean).join(' · '); break;
    case 'command': out = (d.command || '').split('\n')[0].slice(0, 70); break;
    case 'evidence': out = d.filename || ''; break;
    case 'task': case 'note': case 'action': out = (d.text || '').slice(0, 70); break;
  }
  if (!out) {
    const first = Object.entries(d).find(([k, v]) => v !== null && v !== undefined && v !== '');
    if (first) {
      const label = DATA_LABELS[first[0]] ? t(DATA_LABELS[first[0]]) : first[0];
      out = `${label}: ${typeof first[1] === 'object' ? JSON.stringify(first[1]) : first[1]}`;
    }
  }
  return (out || '—').slice(0, 70);
}

/* ============================== API ============================== */
function cookie(name){
  const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.*+?^${}()|[\]\\])/g,'\\$1') + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}
async function api(path, options={}){
  const method = options.method || 'GET';
  const headers = Object.assign({'X-ShadowEdge':'1'}, options.headers || {});
  if (options.body !== undefined){ headers['Content-Type']='application/json'; }
  const csrf = cookie('shadowedge_csrf');
  if (csrf && method !== 'GET' && method !== 'HEAD'){ headers['X-ShadowEdge-CSRF']=csrf; }
  const resp = await fetch('/api/v1' + path, {
    method, headers, credentials:'same-origin',
    body: options.body === undefined ? undefined : JSON.stringify(options.body)
  });
  let payload = null;
  if (resp.status !== 204){ try { payload = await resp.json(); } catch(e){} }
  if (resp.status === 401){
    state.user = null;
    if (location.hash !== '#/login') location.hash = '#/login';
    throw new Error(t('error'));
  }
  if (!resp.ok){ throw new Error(payload && payload.error ? payload.error.message : ('HTTP ' + resp.status)); }
  return payload ? payload.data : null;
}

    const rows = Array.from(document.querySelectorAll('#finding-rows tr'));

async function renderGraph(view, id){
  view.innerHTML = `<div class="graph" id="graph-container"></div><div class="meta mt">${esc(t('graph_hint'))}</div>`;
  const data = await api('/projects/' + encodeURIComponent(id) + '/graph');
  state.graph = data;
  const container = document.getElementById('graph-container');
  if (!container) return;
  if (state.network){ try{ state.network.destroy(); }catch(e){} state.network = null; }
  if (!data.nodes || !data.nodes.length){ container.innerHTML = `<div class="empty" style="padding-top:260px">${esc(t('no_entities'))}</div>`; return; }
  const nodes = new vis.DataSet(data.nodes.map(n => ({
    id:n.id, label:n.title + '\n' + kindLabel(n.kind),
    shape:'box', margin:10, borderWidth:2,
    color:{background:kindColor(n.kind), border:kindColor(n.kind), highlight:{background:'#22d3ee', border:'#22d3ee'}},
    font:{color:'#07131a', size:11, face:'-apple-system,BlinkMacSystemFont,Segoe UI,monospace'}
  })));
  const edges = new vis.DataSet((data.edges || []).map(e => ({
    id:e.id, from:e.from_entity_id, to:e.to_entity_id, label:e.label || '',
    arrows:{to:{enabled:true, scaleFactor:.6}}, color:{color:'#475569', highlight:'#22d3ee'},
    font:{color:'#94a3b8', size:10}
  })));
  state.network = new vis.Network(container, {nodes, edges}, {
    physics:{enabled:true, stabilization:{iterations:120}, barnesHut:{gravitationalConstant:-3500, springLength:150, springConstant:.045, damping:.09}},
    interaction:{hover:true, dragNodes:true, zoomView:true, dragView:true}
  });
  state.network.on('click', params => { if (params.nodes && params.nodes.length) showEntityDetail(params.nodes[0]); });
}

function fieldInput(key, labelKey, type, value){
  const label = `<label>${esc(t(labelKey))}</label>`;
  const val = value == null ? '' : value;
  if (type === 'target'){
    const options = state.entities.filter(e => e.kind === 'target').map(e => `<option value="${esc(e.id)}" ${String(val)===e.id?'selected':''}>${esc(e.title)}</option>`).join('');
    return `<div class="field">${label}<select name="f_${key}"><option value="">--</option>${options}</select></div>`;
  }
  if (type === 'service'){
    const options = state.entities.filter(e => e.kind === 'service').map(e => `<option value="${esc(e.id)}" ${String(val)===e.id?'selected':''}>${esc(e.title)}</option>`).join('');
    return `<div class="field">${label}<select name="f_${key}"><option value="">--</option>${options}</select></div>`;
  }
  if (type === 'severity'){
    return `<div class="field">${label}<select name="f_${key}"><option value="" ${val===''?'selected':''}>--</option>${['critical','high','medium','low','info'].map(s=>`<option value="${s}" ${val===s?'selected':''}>${esc(severityLabel(s))}</option>`).join('')}</select></div>`;
  }
  if (type === 'textarea') return `<div class="field">${label}<textarea name="f_${key}">${esc(val)}</textarea></div>`;
  return `<div class="field">${label}<input name="f_${key}" type="${type}" value="${esc(val)}"></div>`;
}

function renderEntityFields(container, kind, spec, data){
  if (kind !== 'finding'){
    container.innerHTML = spec.map(([key,label,type]) => fieldInput(key,label,type,data ? data[key] : '')).join('');
    return;
  }
  const byKey = new Map(spec.map(field => [field[0], field]));
  container.innerHTML = FINDING_SECTIONS.map(([label, keys]) => {
    const fields = keys.map(key => byKey.get(key)).filter(Boolean);
    if (!fields.length) return '';
    return `<div class="form-section"><h4>${esc(t(label))}</h4><div class="row">${fields.map(([key,lbl,type]) => fieldInput(key,lbl,type,data ? data[key] : '')).join('')}</div></div>`;
  }).join('');
}

}

function allPhaseKeys(){
  const keys = new Set();
  Object.values(PHASE_SCHEMAS).forEach(s => (s.fields || []).forEach(([key]) => keys.add(key)));
  return keys;
}

function phaseLabel(key){
  const p = (state.phases || []).find(x => x.key === key);
  return p ? phaseName(p) : key;
}

function phaseFieldSpec(phase, kind){
  const kindKeys = new Set((KIND_FIELDS[kind] || []).map(([key]) => key));
  return ((PHASE_SCHEMAS[phase] || {}).fields || []).filter(([key]) => !kindKeys.has(key));
}

function renderPhaseFields(kind, phase, data){
  const box = document.getElementById('phase-fields-wrap');
  const wrap = document.getElementById('phase-fields');
  const name = document.getElementById('phase-fields-name');
  if (!box || !wrap) return;
  const spec = phaseFieldSpec(phase, kind);
  box.style.display = spec.length ? '' : 'none';
  if (name) name.textContent = phaseLabel(phase);

  const known = new Set([...spec.map(([key]) => key), ...allPhaseKeys(), 'finding_key', 'phase_history']);

  if (kindSelect && !entity){

function collectEntityData(form){
  const data = state.editingEntity ? Object.assign({}, state.editingEntity.data || {}) : {};
  const kind = form.querySelector('[name=kind]') ? form.querySelector('[name=kind]').value : (state.editingEntity ? state.editingEntity.kind : 'target');
  const phase = form.querySelector('[name=phase]') ? form.querySelector('[name=phase]').value : (state.editingEntity ? state.editingEntity.phase : '');
  const specs = [...(KIND_FIELDS[kind] || []), ...((PHASE_SCHEMAS[phase] || {}).fields || [])];
  const seen = new Set();
  specs.forEach(([key,label,type]) => {
    if (seen.has(key)) return;
    seen.add(key);
    const el = form.querySelector('[name=f_' + key + ']');
    if (!el) return;
    let v = el.value;
    if (v === ''){ delete data[key]; return; }
    if (type === 'number'){ const n = Number(v); v = isNaN(n) ? v : n; }
    data[key] = v;
  });
  const customKeys = new Set();
  form.querySelectorAll('#custom-fields .custom-field-row').forEach(row => {
    const keyEl = row.querySelector('.cf-key');
    const valueEl = row.querySelector('.cf-value');
    if (!keyEl || !valueEl) return;
    const key = keyEl.value.trim();
    if (!key) return;
    customKeys.add(key);
    const raw = valueEl.value;
    let value = raw;
    if (raw !== '' && /^[\[{]/.test(raw)) {
      try { value = JSON.parse(raw); } catch(e){}
    }
    data[key] = value;
  });
  const phaseKeys = allPhaseKeys();
  const kindKeys = new Set((KIND_FIELDS[kind] || []).map(([key]) => key));
  const internalKeys = new Set(['finding_key', 'phase_history']);
  Object.keys((state.editingEntity && state.editingEntity.data) || {}).forEach(key => {
    if (!phaseKeys.has(key) && !kindKeys.has(key) && !customKeys.has(key) && !internalKeys.has(key)) delete data[key];
  });
  return data;
}

async function refreshCurrent(){
  const hash = location.hash || '#/';
  if (!state.user) return renderAuth(hash === '#/register' ? 'register' : 'login');
  if (hash.startsWith('#/project/')) {
    const m = hash.match(/^#\/project\/([^/]+)(?:\/([^/]+))?/);
    if (m) return renderProject(m[1], m[2] || 'board');
  }
  if (hash === '#/admin') return renderAdmin();
  return renderProjects();
}

function closeStream(){
  clearTimeout(state.refreshTimer);
  state.refreshTimer = null;
  clearTimeout(state.streamTimer);
  state.streamTimer = null;
  state.streamTimerProject = null;
  state.pendingRefresh = false;
  const ws = state.stream;
  state.stream = null;
  state.streamProject = null;
  if (ws){ try { ws.close(); } catch(e){} }
}

function openStream(id){
  closeStream();
  if (!state.user || !window.WebSocket) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/v1/projects/${encodeURIComponent(id)}/stream`);
  state.stream = ws;
  state.streamProject = id;
  ws.onopen = () => { state.streamBackoff = 2000; };
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'changed' || msg.type === 'ready') scheduleRefresh();
    } catch(e){}
  };
  ws.onclose = () => {
    if (state.stream !== ws) return;
    state.stream = null;
    state.streamProject = null;
    if (state.user && state.project && state.project.id === id) {
      const delay = state.streamBackoff;
      state.streamBackoff = Math.min(state.streamBackoff * 2, 30000);
      state.streamTimerProject = id;
      state.streamTimer = setTimeout(() => {
        state.streamTimer = null;
        state.streamTimerProject = null;
        if (state.user && state.project && state.project.id === id && !state.stream) openStream(id);
      }, delay);
    }
  };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}

function scheduleRefresh(){
  const active = document.activeElement;
  if (document.querySelector('.modal') || (active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName))) {
    state.pendingRefresh = true;
    return;
  }
  state.pendingRefresh = false;
  clearTimeout(state.refreshTimer);
  state.refreshTimer = setTimeout(() => {
    if (state.user && state.project) refreshCurrent();
  }, 300);
}

document.addEventListener('focusout', () => {
  if (state.pendingRefresh && !document.querySelector('.modal')) {
    state.pendingRefresh = false;
    setTimeout(() => scheduleRefresh(), 0);
  }
});

document.addEventListener('submit', async ev => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const button = form.querySelector('button[type=submit]');
  if (button) button.disabled = true;
  try {
    const fd = new FormData(form);
    const val = name => (fd.get(name) || '').toString();
    switch (form.dataset.form){
      case 'login': {
        const data = await api('/auth/login', {method:'POST', body:{username:val('username'), password:val('password')}});
        state.user = data.user;
        state.locale = data.user.locale || state.locale;
        localStorage.setItem('shadowedge_locale', state.locale);
        location.hash = '#/projects';
        break;
      }
      case 'register': {
        if (val('password') !== val('confirm_password')) throw new Error(t('confirm_password'));
        await api('/auth/register', {method:'POST', body:{
          username:val('username'), display_name:val('display_name'), email:val('email'),
          password:val('password'), reason:val('reason')
        }});
        showAuthMessage(t('pending_ok'), 'ok');
        break;
      }
      case 'create-project': {
        const data = await api('/projects', {method:'POST', body:{name:val('name'), description:val('description')}});
        closeModal(); toast(t('project_created')); location.hash = '#/project/' + data.project.id + '/board';
        break;
      }
      case 'add-member': {
        await api('/projects/' + state.project.id + '/members', {method:'POST', body:{username:val('username'), role:val('role')}});
        toast(t('member_created')); await refreshCurrent();
        break;
      }
      case 'entity': {
        const kind = form.querySelector('[name=kind]').value;
        const existing = state.editingEntity || null;
        const body = {kind, title:val('title'), phase:val('phase'), data:collectEntityData(form)};
        let created = null;
        if (existing){
          delete body.kind;
          body.base_version = existing.version;
          await api('/projects/' + state.project.id + '/entities/' + existing.id, {method:'PATCH', body});
        } else {
          created = await api('/projects/' + state.project.id + '/entities', {method:'POST', body});
        }
        closeModal();
        toast(created && created.entity && created.entity.merged ? t('finding_merged') : t('saved'));
        await refreshCurrent();
        break;
      }
      case 'entity-detail': {
        const existing = state.editingEntity;
        const body = {status:val('status'), phase:val('phase'), base_version:existing.version};
        await api('/projects/' + state.project.id + '/entities/' + existing.id, {method:'PATCH', body});
        closeModal(); toast(t('saved')); await refreshCurrent();
        break;
      }
      case 'sync-config': {
        const role = val('role');
        const base = state.syncConfig || {};
        const repoint = role === 'edge' && (base.role !== 'edge' || base.master_url !== val('master_url') || base.remote_project_id !== val('remote_project_id'));
        if (repoint && !confirm(t('sync_repoint_confirm'))) break;
        await api('/projects/' + state.project.id + '/sync/config', {method:'PUT', body:{
          role, master_url: val('master_url'), remote_project_id: val('remote_project_id'),
          token: val('token'), reset: repoint
        }});
        toast(t('sync_saved')); await refreshCurrent();
        break;
      }
      case 'create-token': {
        const data = await api('/admin/tokens', {method:'POST', body:{
          name:val('name'), scopes:val('scopes'), project_id:val('project_id')
        }});
        openModal(`<h3>${esc(t('token_created'))}</h3><div class="sub">${esc(t('token_once'))}</div><pre>${esc(data.token)}</pre><div class="modal-actions"><button class="btn primary" data-action="close-modal">${esc(t('close'))}</button></div>`);
        await renderAdmin();
        break;
      }
      case 'change-password': {
        if (val('new_password') !== val('confirm_password')) throw new Error(t('password_mismatch'));
        await api('/auth/me/password', {method:'PUT', body:{
          old_password: val('old_password'), new_password: val('new_password')
        }});
        closeModal(); toast(t('password_changed'));
        break;
      }
    }
  } catch(err){
    const msg = document.getElementById('auth-msg');
    if (msg) showAuthMessage(err.message || t('error'), 'err');
    else toast(err.message || t('error'), 'err');
  } finally {
    if (button) button.disabled = false;
  }
});

function showAuthMessage(text, kind){
  const el = document.getElementById('auth-msg');
  if (!el) return;
  el.textContent = text;
  el.className = 'msg show ' + kind;
}

/* ============================== router ============================== */
async function route(){
  try {
    const hash = location.hash || '#/';
    if (!state.user){
      closeStream();
      renderAuth(hash === '#/register' ? 'register' : 'login');
      return;
    }
    if (hash === '#/admin'){ closeStream(); await renderAdmin(); return; }
    const m = hash.match(/^#\/project\/([^/]+)(?:\/([^/]+))?/);
    if (m){ await renderProject(m[1], m[2] || 'board'); return; }
    closeStream();
    if (hash === '#/login' || hash === '#/register'){ location.hash = '#/projects'; return; }
    await renderProjects();
  } catch(err){
    if (state.user === null) renderAuth('login');
    else toast(err.message || t('error'), 'err');
  }
}
window.addEventListener('hashchange', route);

async function boot(){
  try {
    const data = await api('/auth/me');
    state.user = data.user;
    if (data.user.locale) state.locale = data.user.locale;
  } catch(e){ state.user = null; }
  route();
}
boot();
})();
</script>
</body>
</html>
